name: frontend-gates

on:
  push:
    branches: [master, "fix/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm run test
      - name: Typecheck and production bundle
        run: npm run build
      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Browser smoke and offline PWA
        run: npm run test:e2e
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: universal-reader-pwa
          path: dist/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload browser test diagnostics
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Enforce frontend-only runtime
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          for (const name of ['express','fastify','koa','@openuidev/server']) {
            if (pkg.dependencies?.[name] || pkg.devDependencies?.[name]) {
              throw new Error('Backend dependency forbidden: ' + name);
            }
          }
          if (fs.existsSync('server')) throw new Error('Backend folder is forbidden');
          if (!fs.existsSync('dist/index.html')) throw new Error('Static build missing');
          console.log('PASS: frontend-only static build');
          NODE
